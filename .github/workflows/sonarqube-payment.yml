name: SonarQube Payment Service Analysis

on:
  push:
    branches:
      - main
    paths:
      - "payment-service/**"
      - ".github/workflows/sonarqube-payment.yml"
  pull_request:
    branches:
      - main
    paths:
      - "payment-service/**"
      - ".github/workflows/sonarqube-payment.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonarqube:
    name: Analyze Payment Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify SonarQube secrets are available
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          if [ -z "$SONAR_TOKEN" ] || [ -z "$SONAR_HOST_URL" ]; then
            echo "SONAR_TOKEN or SONAR_HOST_URL is empty (missing secret, or run from a fork)."
            exit 1
          fi

      - name: Analyze with SonarQube
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: payment-service
          args: >
            -Dsonar.projectKey=payment-service
            -Dsonar.projectName=payment-service
            -Dsonar.sources=.
            -Dsonar.exclusions=node_modules/**,coverage/**